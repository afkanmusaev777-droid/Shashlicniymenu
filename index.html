<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шашлычный двор — меню</title>
<style>
:root{--bg:#1c1820;--card:#27222b;--gold:#c9a15b;--txt:#efe6d8;--mut:#a89d8c;--ok:#6fa86f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1820}}
:root[data-theme="dark"]{--bg:#1c1820}
*{box-sizing:border-box}
html{scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Georgia,"Times New Roman",serif;padding-bottom:90px}
header{text-align:center;padding:22px 16px 8px;border-bottom:1px solid var(--gold)}
h1{margin:0;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-size:24px}
.orn{color:var(--gold);letter-spacing:.5em;font-size:14px;margin-top:4px}
.tbl{color:var(--mut);font-size:14px;margin:8px 0 4px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;z-index:5;border-bottom:1px solid #3a3340}
nav a{white-space:nowrap;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:6px 14px;text-decoration:none;font-size:14px}
main{max-width:640px;margin:0 auto;padding:0 14px}
h2{color:var(--gold);font-weight:400;text-transform:uppercase;letter-spacing:.1em;text-align:center;font-size:19px;margin:28px 0 12px}
.it{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid #3a3340;border-radius:10px;padding:12px;margin-bottom:10px}
.it img{background:#3a3340;width:92px;height:92px;object-fit:cover;border-radius:8px;flex:none}.it .n{flex:1}.it .n b{font-weight:400;font-size:16px}.it .n small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.pr{color:var(--gold);white-space:nowrap;font-size:16px}
.q{display:flex;align-items:center;gap:8px}
button{font:inherit;cursor:pointer}
.q button{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold);font-size:20px;line-height:1}
.q span{min-width:16px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--gold);z-index:6}
.big{width:100%;padding:14px;border-radius:10px;border:0;background:var(--gold);color:#1c1820;font-size:17px}
.big[disabled]{opacity:.4}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9;display:none}
.sheet>div{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #3a3340}
textarea,input{width:100%;background:var(--card);color:var(--txt);border:1px solid #3a3340;border-radius:8px;padding:10px;font:inherit;margin-top:10px}
.sec{background:none;border:1px solid var(--gold);color:var(--gold);width:100%;padding:12px;border-radius:10px;margin-top:8px}
.msg{padding:14px;border-radius:10px;background:var(--card);margin:12px 0}
.ord{background:var(--card);border:1px solid #3a3340;border-left:4px solid var(--gold);border-radius:10px;padding:12px;margin:12px 0}
.ord.confirmed{border-left-color:#d9b24a}.ord.done{border-left-color:var(--ok);opacity:.6}
.ord h3{margin:0 0 6px;font-weight:400}.ord .st{color:var(--mut);font-size:13px}
.ord button{margin:8px 8px 0 0;padding:9px 14px;border-radius:8px;border:1px solid var(--gold);background:none;color:var(--gold)}
.ord button.p{background:var(--gold);color:#1c1820}
</style>
</head>

var ITEMS=[],cart={},$=function(i){return document.getElementById(i)};

function guest(){

    });
  });

}

  var h='<h2 style="margin-top:0">'+(ok?"Заказ отправлен":"Покажите заказ официанту")+'</h2>';
  h+=ok?'<div class="msg">Официант получил заказ для стола № '+esc(tn)+' и скоро подойдёт.</div>':'<div class="msg">Автоматическая отправка сейчас недоступна (причина: '+esc(why)+'). Покажите этот экран официанту — он оформит заказ.</div>';
  lines.forEach(function(l){h+='<div class="row"><span>'+esc(l.n)+' × '+l.q+'</span><span class="pr">'+l.q*l.p+' ₽</span></div>'});
  h+='<div class="row"><b>Итого</b><b class="pr">'+o.total+' ₽</b></div><button class="sec" id="new">Новый заказ</button>';
  $("sheetIn").innerHTML=h;
  $("new").onclick=function(){cart={};$("sheet").style.display="none";guest()};
}
async function waiter(){
  $("tbl").textContent="Панель официанта";
  $("app").innerHTML='<main><div class="msg" id="wm">Загрузка заказов…</div><div id="wl"></div></main>';
  var db=null;try{db=await claude.use("db")}catch(e){}
  if(!db){$("wm").textContent="Заказы недоступны: войдите в аккаунт с доступом к странице.";return}
  var tm=setTimeout(function(){$("wm").textContent="Не удалось загрузить заказы."},10000);
  db.collection("orders").onSnapshot(function(s){
    clearTimeout(tm);
    var a=s.docs.map(function(d){var x=d.data();x.id=d.id;return x}).sort(function(x,y){return y.ts-x.ts});
    $("wm").style.display=a.length?"none":"block";$("wm").textContent="Заказов пока нет.";
    var L={"new":"Новый","confirmed":"Подтверждён","done":"Выдан"},h="";
    a.forEach(function(o){
      h+='<div class="ord '+esc(o.status)+'"><h3>Стол № '+esc(o.table)+' · '+esc(o.total)+' ₽</h3><div class="st">'+esc(L[o.status]||o.status)+' · '+new Date(o.ts).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})+'</div>';
      (o.items||[]).forEach(function(l){h+='<div>'+esc(l.n)+' × '+esc(l.q)+'</div>'});
      if(o.comment)h+='<div class="st">Комментарий: '+esc(o.comment)+'</div>';
      if(o.status==="new")h+='<button class="p" data-o="'+esc(o.id)+'" data-s="confirmed">Подтвердить</button>';
      if(o.status==="confirmed")h+='<button class="p" data-o="'+esc(o.id)+'" data-s="done">Выдан</button>';
      h+='</div>';
    });
    $("wl").innerHTML=h;
  },function(){clearTimeout(tm);$("wm").textContent="Нет доступа к заказам."});
  $("wl").onclick=function(e){var b=e.target.closest("button[data-o]");if(b)db.doc("orders/"+b.dataset.o).update({status:b.dataset.s}).catch(function(){})};
}
window.addEventListener("hashchange",route);route();
</script>
